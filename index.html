<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/mamatochterontour-favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/mamatochterontour-favicon.png"
    />

    <!-- Title -->
    <title>
      MamaTochterOnTour – Reiseinspiration, Reiseguides & echte Travel Stories
    </title>

    <!-- Meta Description -->
    <meta
      name="description"
      content="MamaTochterOnTour ist ein Reiseprojekt mit echten Reiseerfahrungen, Guides und Inspiration für deine nächsten Abenteuer weltweit – authentisch, persönlich und unterwegs erstellt."
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="Reiseblog, Reiseinspiration, Reiseguides, Travel Blog, Mallorca Reisen, Reise App, Mama Tochter Reisen, Travel Stories"
    />

    <!-- Author -->
    <meta
      name="author"
      content="MamaTochterOnTour"
    />

    <!-- Search Engine Control -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://mamatochterontour.de"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="MamaTochterOnTour"
    />

    <meta
      property="og:title"
      content="MamaTochterOnTour – Reiseinspiration & Reiseguides"
    />

    <meta
      property="og:description"
      content="Echte Reiseerlebnisse, Guides und Inspiration für deine nächsten Abenteuer weltweit."
    />

    <meta
      property="og:url"
      content="https://mamatochterontour.de"
    />

    <meta
      property="og:image"
      content="/og-image.jpg"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="MamaTochterOnTour – Reiseinspiration & Guides"
    />

    <meta
      name="twitter:description"
      content="Echte Reiseerlebnisse & Travel Guides für deine nächsten Abenteuer."
    />

    <meta
      name="twitter:image"
      content="/og-image.jpg"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#ffffff"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
